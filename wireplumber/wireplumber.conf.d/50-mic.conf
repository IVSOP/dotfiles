# Razer Seiren V3 Mini capture settings.
#
# Replaces main.lua.d/50-mic.lua. WirePlumber 0.5 dropped Lua configuration
# entirely -- it logs "Old configuration file detected ... NOT supported" and
# ignores the file, so the old rule had stopped applying at all.
#
#   systemctl --user restart wireplumber
#   wpctl status                        # find the source id
#   wpctl inspect <id> | grep audio.    # should show S24LE / 48000
#
# Format naming was the other half of the old bug: the lua asked for "S24_LE",
# which is the *ALSA* spelling of the 4-byte-per-sample layout. SPA names it
# differently -- SPA "S24LE" is ALSA's S24_3LE (3 bytes packed), SPA "S24_32LE"
# is ALSA's S24_LE. /proc/asound/card2/stream0 lists only S16_LE and S24_3LE
# for this mic, so S24LE is the only 24-bit format it can actually do; the old
# value named a layout the hardware never offered, hence "they are still at 16".
#
# 48 kHz and not the 96 kHz the descriptor also advertises: the graph runs
# clock.allowed-rates = [ 48000 ], so a 96 kHz capture would just be resampled
# down for every consumer. Matching the graph rate avoids that entirely.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_input.usb-Razer_Inc._Razer_Seiren_V3_Mini-00.mono-fallback"
      }
    ]
    actions = {
      update-props = {
        audio.format   = "S24LE"
        audio.rate     = 48000
        audio.channels = 1

        # Never suspend the mic. WirePlumber's default is to close an idle
        # node after 5s; on a USB mic that means the next capture has to
        # re-open the ALSA device, which costs the first fraction of a second
        # of speech. 0 disables it -- the tradeoff is the mic stays powered
        # and its LED stays lit.
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
